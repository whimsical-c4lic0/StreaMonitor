name: Live end-to-end

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: live e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.13.9
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Visit live streaming sites
        env:
          STRMNTR_E2E: "1"
          STRMNTR_REQUIRE_MEDIA_TOOLS: "1"
        run: uv run --frozen --no-sync pytest tests/e2e -m e2e -v
