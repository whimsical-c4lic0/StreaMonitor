[project]
name = "streamonitor"
version = "0.1.0"
description = "Monitor and record live streams from various websites."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiortc",
    "av",
    "beautifulsoup4",
    "curl_cffi",
    "django-environ",
    "fake-useragent",
    "ffmpy",
    "flask",
    "m3u8",
    "numpy",
    "pycurl",
    "pycurl-requests",
    "pyzmq",
    "requests",
    "termcolor",
    "terminaltables",
    "websocket-client",
    "websockets",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<1.20",
    "pytest>=8.0",
    "ruff>=0.14,<0.15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [".venv", "downloads"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports are part of the package API

[tool.mypy]
python_version = "3.10"
files = ["streamonitor/enums", "streamonitor/models", "streamonitor/utils"]
ignore_missing_imports = true
warn_unused_ignores = true
